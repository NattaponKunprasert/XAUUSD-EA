name: XAUUSD EA daily agent

on:
  # Scheduled cloud-agent runs disabled at the user's request on 2026-07-05.
  # Keep manual dispatch available for an explicit future decision.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: xauusd-ea-daily-agent
  cancel-in-progress: false

jobs:
  daily-milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # The 30-day scheduled trial runs through 20 July 2026, then exits before calling the API.
      TRIAL_END_DATE_UTC: "2026-07-20"

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce trial window, choose model, and select work mode
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [[ "$today" > "$TRIAL_END_DATE_UTC" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The one-month trial ended on $TRIAL_END_DATE_UTC; skipping before API use."
            exit 0
          fi

          # All scheduled UTC hours map to the same Bangkok calendar day.
          if [ "$(date -u +%u)" = "7" ]; then
            model="gpt-5.5"
          else
            model="gpt-5.4"
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected model: $model"

          open_prs="$(gh pr list --state open --limit 100 --json number,headRefName,url,createdAt             --jq '[.[] | select(.headRefName | startswith("codex/daily-"))] | sort_by(.createdAt)')"
          count="$(printf '%s' "$open_prs" | jq 'length')"
          if [ "$count" -gt 0 ]; then
            branch="$(printf '%s' "$open_prs" | jq -r '.[0].headRefName')"
            pr_number="$(printf '%s' "$open_prs" | jq -r '.[0].number')"
            pr_url="$(printf '%s' "$open_prs" | jq -r '.[0].url')"
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "prompt_file=.github/codex/prompts/daily-pr-maintainer.md" >> "$GITHUB_OUTPUT"
            echo "Resuming oldest open daily-agent PR #$pr_number ($branch); open PR count=$count."
          else
            branch="codex/daily-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "mode=new" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "prompt_file=.github/codex/prompts/daily-builder.md" >> "$GITHUB_OUTPUT"
            echo "No open daily-agent PR; starting a new bounded milestone."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Prepare daily-agent branch
        if: steps.gate.outputs.run == 'true'
        id: branch
        shell: bash
        env:
          WORK_MODE: ${{ steps.gate.outputs.mode }}
          WORK_BRANCH: ${{ steps.gate.outputs.branch }}
          SELECTED_PROMPT: ${{ steps.gate.outputs.prompt_file }}
        run: |
          set -euo pipefail
          runtime_prompt="$RUNNER_TEMP/daily-agent-prompt.md"
          cp "$SELECTED_PROMPT" "$runtime_prompt"
          git config user.name "XAUUSD EA Daily Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$WORK_MODE" = "resume" ]; then
            git fetch origin "$WORK_BRANCH"
            git checkout -B "$WORK_BRANCH" "origin/$WORK_BRANCH"
            if ! git merge --no-edit main; then
              git merge --abort || true
              echo "::warning::Automatic main merge failed; the PR maintainer will resolve the divergence from a clean branch."
            fi
          else
            git checkout -b "$WORK_BRANCH"
          fi
          echo "name=$WORK_BRANCH" >> "$GITHUB_OUTPUT"
          echo "prompt_file=$runtime_prompt" >> "$GITHUB_OUTPUT"

      - name: Run bounded Codex milestone
        if: steps.gate.outputs.run == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.branch.outputs.prompt_file }}
          model: ${{ steps.gate.outputs.model }}
          effort: medium
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-schema: |
            {
              "type": "object",
              "properties": {
                "chosen_milestone": {"type": "string"},
                "summary": {"type": "string"},
                "files_changed": {"type": "array", "items": {"type": "string"}},
                "tests": {"type": "array", "items": {"type": "string"}},
                "correctness_risks": {"type": "array", "items": {"type": "string"}},
                "blockers": {"type": "array", "items": {"type": "string"}},
                "recommended_next_milestone": {"type": "string"},
                "merge_recommended": {"type": "boolean"},
                "risk_level": {"type": "string", "enum": ["low", "medium", "high"]}
              },
              "required": [
                "chosen_milestone",
                "summary",
                "files_changed",
                "tests",
                "correctness_risks",
                "blockers",
                "recommended_next_milestone",
                "merge_recommended",
                "risk_level"
              ],
              "additionalProperties": false
            }

      - name: Run test suite
        if: steps.gate.outputs.run == 'true'
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit and push intentional changes
        if: steps.gate.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XAUUSD EA Daily Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to publish."
            exit 0
          fi
          git commit -m "Daily agent: advance one bounded milestone"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate autonomous merge policy
        if: steps.gate.outputs.run == 'true' && (steps.changes.outputs.changed == 'true' || steps.gate.outputs.mode == 'resume')
        id: merge_policy
        shell: bash
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          WORK_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail

          recommendation="$(printf '%s' "$CODEX_FINAL_MESSAGE" | jq -r '.merge_recommended')"
          risk_level="$(printf '%s' "$CODEX_FINAL_MESSAGE" | jq -r '.risk_level')"
          blocker_count="$(printf '%s' "$CODEX_FINAL_MESSAGE" | jq '.blockers | length')"
          file_count="$(git diff --name-only main...HEAD | wc -l | tr -d ' ')"
          changed_lines="$(git diff --numstat main...HEAD | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          deleted_count="$(git diff --name-only --diff-filter=D main...HEAD | wc -l | tr -d ' ')"
          safe_files=true
          if [ "$WORK_MODE" = "resume" ]; then
            max_files=10
            max_changed_lines=800
          else
            max_files=6
            max_changed_lines=400
          fi

          while IFS= read -r file; do
            case "$file" in
              xauusd_ea/*|tests/*|PROJECT_STATUS.md|README.md)
                ;;
              *)
                safe_files=false
                echo "Manual review required for protected or unrecognized path: $file"
                ;;
            esac
          done < <(git diff --name-only main...HEAD)

          auto_merge=false
          if [ "$TEST_OUTCOME" = "success" ] \
            && [ "$recommendation" = "true" ] \
            && [ "$risk_level" != "high" ] \
            && [ "$blocker_count" -eq 0 ] \
            && [ "$safe_files" = "true" ] \
            && [ "$file_count" -le "$max_files" ] \
            && [ "$changed_lines" -le "$max_changed_lines" ] \
            && [ "$deleted_count" -eq 0 ]; then
            auto_merge=true
          fi

          echo "auto_merge=$auto_merge" >> "$GITHUB_OUTPUT"
          echo "recommendation=$recommendation" >> "$GITHUB_OUTPUT"
          echo "risk_level=$risk_level" >> "$GITHUB_OUTPUT"
          echo "Auto-merge decision: $auto_merge"
          echo "Tests=$TEST_OUTCOME recommendation=$recommendation risk=$risk_level blockers=$blocker_count files=$file_count/$max_files changed_lines=$changed_lines/$max_changed_lines deletions=$deleted_count safe_files=$safe_files mode=$WORK_MODE"

      - name: Open pull request
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'new' && steps.changes.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          body="Automated bounded daily milestone using ${{ steps.gate.outputs.model }}.\n\nWorkflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nTest outcome: ${{ steps.tests.outcome }}\nAgent merge recommendation: ${{ steps.merge_policy.outputs.recommendation }}\nRisk level: ${{ steps.merge_policy.outputs.risk_level }}\nAutonomous merge decision: ${{ steps.merge_policy.outputs.auto_merge }}\nTrial end date: ${TRIAL_END_DATE_UTC}\n\nIf this PR remains open, the next scheduled run will repair and re-evaluate the same PR instead of skipping it."
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "${{ steps.branch.outputs.name }}" \
              --title "Daily agent: bounded XAUUSD EA milestone" \
              --body "$body")"
          else
            pr_url="$(gh pr create \
              --draft \
              --base main \
              --head "${{ steps.branch.outputs.name }}" \
              --title "Daily agent: milestone needs test fixes" \
              --body "$body")"
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Auto-merge agent-approved change
        if: steps.gate.outputs.run == 'true' && steps.merge_policy.outputs.auto_merge == 'true'
        shell: bash
        env:
          WORK_MODE: ${{ steps.gate.outputs.mode }}
          EXISTING_PR_URL: ${{ steps.gate.outputs.pr_url }}
          NEW_PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$WORK_MODE" = "resume" ]; then
            pr_url="$EXISTING_PR_URL"
          else
            pr_url="$NEW_PR_URL"
          fi
          if gh pr merge "$pr_url" --squash --delete-branch; then
            echo "Autonomously merged $pr_url"
          else
            echo "::warning::The agent approved the merge but GitHub did not allow it. The next scheduled run will retry the same PR."
          fi
