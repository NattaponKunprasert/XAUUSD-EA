name: XAUUSD D2 CI provenance

on:
  workflow_dispatch:
  push:
    paths:
      - "xauusd_ea/research_v2_volatility_shock_d1.py"
      - "xauusd_ea/research_v2_volatility_shock_d2.py"
      - "xauusd_ea/d2_runtime_primitives.py"
      - "config/xm_micro_gold.json"
      - "config/research_v2_r3_h1_volatility_shock_d1_contract.json"
      - "config/research_v2_r3_h1_volatility_shock_d1_audit_evidence.json"
      - "config/research_v2_r3_h1_volatility_shock_d2_audit_evidence.json"
      - "tests/test_research_v2_r3_h1_volatility_shock_d1.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d1_evidence_oracle.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2_evidence_oracle.py"
      - "tests/fixtures/research_v2_r3_h1_volatility_shock_*"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2_ci_provenance.py"
      - "config/d2_ci_requirements.lock"
      - "tools/build_d2_ci_provenance.py"
      - ".github/workflows/xauusd-d2-ci-attestation.yml"
  pull_request:
    paths:
      - "xauusd_ea/research_v2_volatility_shock_d1.py"
      - "xauusd_ea/research_v2_volatility_shock_d2.py"
      - "xauusd_ea/d2_runtime_primitives.py"
      - "config/xm_micro_gold.json"
      - "config/research_v2_r3_h1_volatility_shock_d1_contract.json"
      - "config/research_v2_r3_h1_volatility_shock_d1_audit_evidence.json"
      - "config/research_v2_r3_h1_volatility_shock_d2_audit_evidence.json"
      - "tests/test_research_v2_r3_h1_volatility_shock_d1.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d1_evidence_oracle.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2.py"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2_evidence_oracle.py"
      - "tests/fixtures/research_v2_r3_h1_volatility_shock_*"
      - "tests/test_research_v2_r3_h1_volatility_shock_d2_ci_provenance.py"
      - "config/d2_ci_requirements.lock"
      - "tools/build_d2_ci_provenance.py"
      - ".github/workflows/xauusd-d2-ci-attestation.yml"

# No repository mutation, package publishing, deployment, or token beyond
# official artifact provenance are permitted by this workflow.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  d2-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Verified from official action refs on 2026-08-31. Keep this allowlist
      # synchronized with the static provenance test.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies without a package cache
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all:
          --require-hashes -r config/d2_ci_requirements.lock
      - name: Run cache-free bounded D1/D2 accounting checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -B -m pytest -q --cache-clear
          tests/test_research_v2_r3_h1_volatility_shock_d2_ci_provenance.py
          tests/test_research_v2_r3_h1_volatility_shock_d1.py
          tests/test_research_v2_r3_h1_volatility_shock_d1_evidence_oracle.py
          tests/test_research_v2_r3_h1_volatility_shock_d2.py
          tests/test_research_v2_r3_h1_volatility_shock_d2_evidence_oracle.py
          tests/test_broker_profile_runtime.py tests/test_accounting_extensions.py
      - name: Build bounded D2 provenance input
        run: >-
          python -B tools/build_d2_ci_provenance.py
          --output d2-ci-provenance.json --commit-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --server-url "$GITHUB_SERVER_URL"
      - name: Upload provenance input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xauusd-d2-ci-provenance
          path: d2-ci-provenance.json
          if-no-files-found: error
      - name: Attest provenance input
        # GitHub intentionally withholds attestation write authority from an
        # untrusted fork PR.  Such PRs still run checks and upload input, but
        # only a repository-controlled run may create external provenance.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: d2-ci-provenance.json
